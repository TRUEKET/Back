
name: Backend Production Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      # 1. 프로젝트 코드 다운로드
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Java 17 설치
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 설정
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Gradle 실행 권한 부여
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 5. 테스트 및 빌드
      - name: Build and test
        run: ./gradlew clean build --no-daemon

      # 6. 실행 가능한 JAR 준비
      - name: Prepare application JAR
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            | head -n 1)

          test -n "$JAR"
          cp "$JAR" app.jar

      # 7. AWS OIDC 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 8. ECR 로그인
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 9. Docker 이미지 생성 및 업로드
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # 10. SSM을 이용한 EC2 배포
      - name: Deploy to EC2 using SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"sudo /opt/trueket/deploy.sh $IMAGE_TAG\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment successful"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment confirmation timed out"
          exit 1
