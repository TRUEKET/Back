spring.application.name=backend

# Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

auth.phone.encryption-key=${PHONE_ENCRYPTION_KEY}
auth.phone.hash-key=${PHONE_HASH_KEY}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Gemini: key stays in the local run configuration.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.thinking-level=${GEMINI_THINKING_LEVEL:low}
analysis.model-timeout=${ANALYSIS_MODEL_TIMEOUT:30s}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=105MB

# Used only when withdrawal has stored photos to remove. Keep the service role key server-side.
storage.supabase-url=${SUPABASE_URL:}
storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
storage.evidence-bucket=${EVIDENCE_STORAGE_BUCKET:report-evidence}
storage.trueshot-masked-bucket=${TRUESHOT_MASKED_STORAGE_BUCKET:trueshot-photos}
storage.trueshot-original-bucket=${TRUESHOT_ORIGINAL_STORAGE_BUCKET:trueshot-photos}

# Select one provider explicitly. No automatic paid-provider fallback.
analysis.ai-provider=${AI_PROVIDER:gemini}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-6-luna}
openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:8192}
