spring.application.name=backend

# multipart/form-data 요청 파라미터를 Swagger 요청 본문에 표시
springdoc.default-support-form-data=true

# 2차 사진 판정 재시도 간격과 접수 후 최대 대기 시간
trueshot.judgment.retry-delay-ms=${TRUESHOT_JUDGMENT_RETRY_DELAY_MS:10000}
trueshot.judgment.max-wait=${TRUESHOT_JUDGMENT_MAX_WAIT:60s}

# Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security
security.identifier-hash-secret=${IDENTIFIER_HASH_SECRET}
security.identifier-encryption-key=${IDENTIFIER_ENCRYPTION_KEY}



auth.phone.encryption-key=${PHONE_ENCRYPTION_KEY}
auth.phone.hash-key=${PHONE_HASH_KEY}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Gemini: key stays in the local run configuration.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.thinking-level=${GEMINI_THINKING_LEVEL:low}
analysis.model-timeout=${ANALYSIS_MODEL_TIMEOUT:30s}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=105MB

# Used only when withdrawal has stored photos to remove. Keep the service role key server-side.
storage.supabase-url=${SUPABASE_URL:}
storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
storage.evidence-bucket=${EVIDENCE_STORAGE_BUCKET:report-evidence}
storage.trueshot-masked-bucket=${TRUESHOT_MASKED_STORAGE_BUCKET:trueshot-photos}
storage.trueshot-original-bucket=${TRUESHOT_ORIGINAL_STORAGE_BUCKET:trueshot-photos}

# Select one provider explicitly. No automatic paid-provider fallback.
analysis.ai-provider=${AI_PROVIDER:gemini}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-6-luna}
openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:8192}

# ==============================
# RP-08 Dispute Email
# ==============================

# SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SMTP Security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeout
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Dispute Email
dispute.mail.enabled=${DISPUTE_MAIL_ENABLED:false}
dispute.mail.from=${MAIL_FROM:}
dispute.mail.support-email=${DISPUTE_SUPPORT_EMAIL:}