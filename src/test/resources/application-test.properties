# PostgreSqlIntegrationSupport supplies an isolated local database dynamically.
# Never point this profile at the shared Supabase project.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4
dispute.mail.enabled=false
security.identifier-hash-secret=test-only-identifier-hash-secret
